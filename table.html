<!DOCTYPE html>
<html>
<head>
    <title>Irregular Table</title>
    <style>
        table{
            border-collapse: collapse;
            width: 700px;
            text-align: center;
        }

        td{
            border: 2px solid black;
            padding: 12px;
            font-size: 22px;
        }
    </style>
</head>

<body>

<h2>Irregular Table</h2>

<table>
    <tr>
        <td colspan="2">A</td>
        <td colspan="4">B</td>
        <td rowspan="4">J</td>
    </tr>

    <tr>
        <td>C</td>
        <td>D</td>
        <td>E</td>
        <td>F</td>
        <td>G</td>
        <td></td>
    </tr>

    <tr>
        <td rowspan="2">K</td>
        <td>M</td>
        <td colspan="2">N</td>
        <td>I</td>
        <td></td>
    </tr>

    <tr>
        <td>L</td>
        <td>P</td>
        <td>O</td>
        <td>I</td>
        <td>H</td>
    </tr>
</table>

</body>
</html>
