<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Song List</title>
</head>
<body>

    <table border="1" cellpadding="10">

        <tr>
            <th colspan="4">Song List</th>
        </tr>

        <tr>
            <th>Sr.No</th>
            <th>Song Name</th>
            <th>Audio</th>
            <th>Download Link</th>
        </tr>

        <tr>
            <td>1</td>
            <td>Song 1</td>

            <td>
                <audio controls>
                    <source src="song1.mp3" type="audio/mpeg">
                </audio>
            </td>

            <td>
                <a href="song1.mp3" download>Download</a>
            </td>
        </tr>

        <tr>
            <td>2</td>
            <td>Song 2</td>

            <td>
                <audio controls>
                    <source src="song2.mp3" type="audio/mpeg">
                </audio>
            </td>

            <td>
                <a href="song2.mp3" download>Download</a>
            </td>
        </tr>

        <tr>
            <td>3</td>
            <td>Song 3</td>

            <td>
                <audio controls>
                    <source src="song3.mp3" type="audio/mpeg">
                </audio>
            </td>

            <td>
                <a href="song3.mp3" download>Download</a>
            </td>
        </tr>

    </table>

</body>
</html>
